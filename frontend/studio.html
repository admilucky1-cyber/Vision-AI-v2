<!DOCTYPE html>
<html lang="en" data-theme="dark" data-theme-preset="humanly">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="app-version" content="4.1.0">
  <title>Vision AI v4.1.0 — Studio</title>
  <script>
  (function(){try{var t=localStorage.getItem('vision_ai_theme')||'dark';document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){}})();
  </script>
  <link rel="stylesheet" href="/frontend/static/css/theme-unified-v380.css?v=390">
  <style>
    body { margin:0; min-height:100vh; background:var(--va-bg,#0b1412); color:var(--va-text,#e8f5f0); font-family:Inter,system-ui,sans-serif; }
    .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:24px; flex-wrap:wrap; }
    header a { color:var(--va-accent,#2dd4bf); text-decoration:none; font-weight:600; }
    h1 { font-size:1.5rem; margin:0; color:#5eead4; }
    .tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
    .tabs button { background:rgba(255,255,255,0.06); border:1px solid rgba(45,212,191,0.2); color:inherit; padding:10px 16px; border-radius:999px; cursor:pointer; font-weight:600; }
    .tabs button.active { background:linear-gradient(135deg,#2dd4bf,#10b981); color:#042f2e; }
    .panel { display:none; background:rgba(18,36,32,0.9); border:1px solid rgba(45,212,191,0.18); border-radius:20px; padding:20px; }
    .panel.active { display:block; animation:vaFadeUp .25s ease both; }
    @keyframes vaFadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    label { display:block; font-size:12px; opacity:.8; margin:12px 0 6px; }
    select, textarea, input { width:100%; box-sizing:border-box; border-radius:12px; border:1px solid rgba(45,212,191,0.25); background:rgba(8,20,18,.9); color:inherit; padding:12px; font:inherit; }
    textarea { min-height:110px; resize:vertical; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    @media(max-width:700px){ .row{grid-template-columns:1fr} }
    .actions { margin-top:16px; display:flex; gap:10px; flex-wrap:wrap; }
    .btn { border:none; border-radius:999px; padding:12px 20px; font-weight:700; cursor:pointer; background:linear-gradient(135deg,#2dd4bf,#10b981); color:#042f2e; }
    .btn.ghost { background:transparent; border:1px solid rgba(45,212,191,.35); color:#5eead4; }
    .msg { margin-top:12px; font-size:13px; opacity:.9; }
    .msg.err { color:#f87171; }
    .msg.ok { color:#5eead4; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-top:16px; }
    .card { background:rgba(0,0,0,.25); border-radius:14px; padding:12px; border:1px solid rgba(255,255,255,.06); font-size:13px; }
    .preview img { max-width:100%; border-radius:12px; margin-top:12px; }
  </style>
  <link rel="stylesheet" href="/frontend/static/css/tokens.css?v=410">
  <link rel="stylesheet" href="/frontend/static/css/core.css?v=410">
  <link rel="stylesheet" href="/frontend/static/css/accessibility.css?v=410">
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Model Studio</h1>
        <div style="opacity:.7;font-size:13px;margin-top:4px">Image · Video · LoRA · Chat stays separate</div>
      </div>
      <div style="display:flex;gap:14px;align-items:center">
        <a href="/">← Chat</a>
        <a href="/boost.html">GPU Boost</a>
        <a href="/upgrade.html">Plans</a>
      </div>
    </header>

    <div class="tabs" role="tablist">
      <button type="button" class="active" data-tab="image">Image</button>
      <button type="button" data-tab="video">Video</button>
      <button type="button" data-tab="train">Train LoRA</button>
      <button type="button" data-tab="models">Models</button>
      <button type="button" data-tab="jobs">Jobs</button>
    </div>

    <section id="panel-image" class="panel active">
      <label>Model</label>
      <select id="imgModel"></select>
      <label>LoRA (optional)</label>
      <select id="imgLora"><option value="">None</option></select>
      <label>Negative prompt</label>
      <input id="imgNeg" placeholder="optional" />
      <label>Prompt</label>
      <textarea id="imgPrompt" placeholder="Cinematic portrait of …"></textarea>
      <div class="actions">
        <button type="button" class="btn" id="imgGen">Generate</button>
      </div>
      <div class="msg" id="imgMsg"></div>
      <div class="preview" id="imgPreview"></div>
    </section>

    <section id="panel-video" class="panel">
      <label>Model</label>
      <select id="vidModel"></select>
      <label>Mode</label>
      <select id="vidMode">
        <option value="i2v" selected>Image → Video (SVD-XT)</option>
        <option value="t2v">Text → Video (only if model supports)</option>
      </select>
      <label>Prompt</label>
      <textarea id="vidPrompt" placeholder="Short clip description (free T4 = short only)"></textarea>
      <div class="actions"><button type="button" class="btn" id="vidGen">Queue video job</button></div>
      <div class="msg" id="vidMsg"></div>
    </section>

    <section id="panel-train" class="panel">
      <label>Dataset ID</label>
      <input id="trainDs" placeholder="ds_… or register below" />
      <label>Base model</label>
      <select id="trainBase"></select>
      <div class="row">
        <div><label>Rank</label><input id="trainRank" type="number" value="16" min="4" max="128" /></div>
        <div><label>Epochs</label><input id="trainEpochs" type="number" value="10" min="1" max="50" /></div>
      </div>
      <div class="actions"><button type="button" class="btn" id="trainStart">Queue training</button></div>
      <div class="msg" id="trainMsg"></div>
      <hr style="border-color:rgba(255,255,255,.08);margin:20px 0">
      <label>Register dataset name</label>
      <input id="dsName" placeholder="My Character Dataset" />
      <label>Drive path</label>
      <input id="dsPath" placeholder="VISION-AI-STORAGE/DATASETS/my-character" />
      <div class="actions"><button type="button" class="btn ghost" id="dsReg">Register dataset</button></div>
      <div class="msg" id="dsMsg"></div>
    </section>

    <section id="panel-models" class="panel">
      <div class="grid" id="modelGrid"></div>
    </section>

    <section id="panel-jobs" class="panel">
      <div class="grid" id="jobGrid"></div>
    </section>
  </div>
  <script src="/frontend/static/js/studio.js?v=390"></script>
</body>
</html>
