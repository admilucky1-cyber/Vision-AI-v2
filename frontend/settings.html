<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - Vision AI v2.0</title>
<!-- Global Theme -->
<link rel="stylesheet" href="/frontend/static/css/style.css">
<!-- Page Layout System -->
<link rel="stylesheet" href="/frontend/static/css/pages.css">
<style>
    /* Page-Specific Styles */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background: var(--bg-deep); color: var(--text-main); }

    .page {
        max-width: 680px; margin: 40px auto; padding: 0 20px 60px;
    }
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
    .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }

    .card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 18px;
        padding: 26px 28px;
        margin-bottom: 22px;
        transition: background 0.3s ease, border 0.3s ease;
    }
    .card h2 { font-size: 15px; font-weight: 700; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }

    .profile-row {
        display: flex; justify-content: space-between; align-items: center;
        padding: 11px 0; border-bottom: 1px solid var(--border-color); font-size: 14px;
        transition: border 0.3s ease;
    }
    .profile-row:last-child { border-bottom: none; }
    .profile-row .label { color: var(--text-muted); }
    .profile-row .value { color: var(--text-main); font-weight: 500; display: flex; align-items: center; gap: 10px; }
    
    .plan-badge {
        display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 12px; font-weight: 700;
        background: var(--plan-bg);
        color: #00C6FF; border: 1px solid var(--plan-border); text-transform: capitalize;
    }

    .form-group { margin-bottom: 16px; position: relative; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: var(--text-muted); }
    .form-group input {
        width: 100%; padding: 12px 14px; padding-right: 45px;
        background: var(--input-bg); border: 1px solid var(--input-border);
        border-radius: 10px; color: var(--text-main); font-size: 14px; outline: none; transition: all .2s;
    }
    .form-group input:focus { border-color: #7b68ee; box-shadow: 0 0 0 3px rgba(123,104,238,0.15); }
    .toggle-password {
        position: absolute; right: 12px; top: 37px; cursor: pointer; background: none; border: none;
        color: var(--text-muted); font-size: 16px;
    }
    .toggle-password:hover { color: var(--text-main); }

    .btn {
        padding: 11px 20px; border-radius: 10px; border: none; cursor: pointer;
        font-weight: 600; font-size: 14px; transition: all .2s;
    }
    .btn-primary { background: linear-gradient(135deg, #00C6FF, #7B68EE); color: #fff; }
    .btn-primary:hover:not(:disabled) { transform: scale(1.02); box-shadow: 0 6px 16px rgba(0,198,255,0.25); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    
    .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
    .btn-outline:hover { background: var(--input-bg); }

    .btn-danger-outline { background: transparent; border: 1px solid rgba(239,68,68,0.35); color: #ef4444; }
    .btn-danger-outline:hover { background: rgba(239,68,68,0.08); }

    .card-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }

    .edit-icon-btn {
        background: transparent; border: none; color: var(--text-muted);
        cursor: pointer; font-size: 14px; padding: 2px 6px;
        border-radius: 6px; transition: all 0.2s;
    }
    .edit-icon-btn:hover { color: #00C6FF; background: var(--input-bg); }
    .edit-input-group { display: flex; gap: 8px; align-items: center; }
    .edit-input-group input { padding: 6px 10px; font-size: 13px; width: 180px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); }
    .edit-input-group input:focus { border-color: #00C6FF; outline: none; }
    .edit-input-group button { padding: 6px 12px; font-size: 12px; }

    .msg { font-size: 13px; padding: 10px 14px; border-radius: 10px; margin-top: 12px; display: none; }
    .msg.show { display: block; }
    .msg.success { background: var(--success-bg); color: var(--success-text); border: 1px solid rgba(34,197,94,0.3); }
    .msg.error { background: var(--error-bg); color: var(--error-text); border: 1px solid rgba(239,68,68,0.3); }

    .loading-state { text-align: center; padding: 60px; color: var(--text-muted); }
    .spinner {
        width: 28px; height: 28px; border: 3px solid var(--border-color); border-top-color: #00C6FF;
        border-radius: 50%; margin: 0 auto 12px; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="page-view">

<div class="page-topbar">
    <div class="page-brand">
        <span class="dot"></span> Vision AI
    </div>
    <div class="topbar-actions" style="display:flex; align-items:center; gap:12px;">
        <!-- 🔥 FIX: Use the theme-toggle-btn class from pages.css -->
        <button class="theme-toggle-btn" id="themeToggle">🌙</button>
        <button class="page-back-btn" onclick="window.history.back()">← Back</button>
    </div>
</div>

<div class="page">
    <h1>⚙️ Settings</h1>
    <p class="subtitle">Manage your profile, theme, plan, and account security.</p>

    <div id="content">
        <div class="loading-state"><div class="spinner"></div>Loading your account…</div>
    </div>
</div>

<script src="/frontend/static/js/settings.js"></script>
</body>
</html>
