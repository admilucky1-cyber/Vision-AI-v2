<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision AI v2.0 - Chat</title>
    
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Sanitizer -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <!-- Highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <!-- UPDATED GLOBAL CSS PATH -->
    <link rel="stylesheet" href="/frontend/static/css/style.css?v=3">
</head>
<body>
    <div id="sidebar-overlay" onclick="closeMobileSidebar()"></div>
    
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 🟢 FIX: Sidebar starts in rail-mode -->
    <aside class="sidebar rail-mode" id="sidebar">
        <div class="sidebar-header">
            <a href="#" class="sidebar-logo">
                <span class="icon">
                    <svg width="28" height="28" viewBox="0 0 100 100" fill="none">
                        <path d="M50 10C25 10 15 35 15 50C15 65 25 90 50 90C75 90 85 65 85 50C85 35 75 10 50 10Z" stroke="url(#grad)" stroke-width="4"/>
                        <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00C6FF"/><stop offset="100%" stop-color="#7B68EE"/></linearGradient></defs>
                        <path d="M50 25C38 25 30 40 30 50C30 60 38 75 50 75C62 75 70 60 70 50C70 40 62 25 50 25Z" stroke="#00C6FF" stroke-width="3" stroke-opacity="0.8"/>
                        <circle cx="50" cy="50" r="8" fill="#FFFFFF"/>
                        <circle cx="52" cy="48" r="3" fill="#00C6FF"/>
                    </svg>
                </span>
                <span>Vision AI</span>
            </a>
        </div>

        <div id="search-bar" class="hidden">
            <input type="text" id="history-search" placeholder="Search history...">
        </div>

        <button class="new-chat-btn" onclick="startNewChat()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>New chat</span>
        </button>

        <button class="cache-clear-btn" onclick="clearAllCaches()" title="Clear all caches">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            <span>Clear Caches</span>
        </button>

        <div class="history-list" id="historyList"></div>

        <div class="sidebar-footer" id="sidebarFooter">
            <!-- The content will be injected via JS -->
        </div>
    </aside>

    <main class="main-content">

        <header class="main-header">
            <!-- Left Side: DeepSeek Style Header Icons -->
            <div class="header-left">
                <!-- Hamburger Menu (Collapses Sidebar) -->
                <button class="icon-btn header-btn" onclick="toggleSidebar()" title="Toggle Sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>

                <!-- Search Icon (Opens Search Bar) -->
                <button class="icon-btn header-btn" onclick="forceOpenSearch()" title="Search History">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
                    </svg>
                </button>
            </div>

            <!-- Center Title -->
            <h1 id="chatTitle">New Chat</h1>
            
            <!-- Right Side Actions -->
            <div class="header-right-actions">
                <select class="model-selector" id="modelSelector">
                    <option value="auto">🤖 Auto</option>
                    <option value="gemini">🧠 Gemini</option>
                    <option value="deepseek">🌀 DeepSeek</option>
                    <option value="groq">⚡ Groq</option>
                    <option value="openrouter">🌐 OpenRouter</option>
                </select>
                <div class="status">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Online</span>
                </div>
            </div>
        </header>

        <div class="chat-container" id="chatOutput"></div>

        <div class="input-area">
            <div class="input-container">
                <textarea id="message" rows="1" placeholder="Ask anything... (Shift+Enter for new line)"></textarea>
                <div class="input-actions">
                    <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Upload File">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤ Send</button>
                </div>
            </div>
            <div class="edit-actions" id="editActions">
                <button class="btn-send-edit" onclick="sendEdit()">✅ Update Message</button>
                <button class="btn-cancel-edit" onclick="cancelEdit()">✖ Cancel</button>
            </div>
            <div id="filePreviewArea" class="file-preview-area"></div>
            <input type="file" id="fileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.bmp,.webp,.txt,.md,.csv,.docx,.pptx,.xlsx,.html,.py">
        </div>
    </main>

    <!-- Floating Theme Toggle Button -->
    <button id="floatingThemeToggle" onclick="toggleTheme()">🌙</button>

    <!-- LOAD EXTERNAL JS -->
    <script src="/frontend/static/js/index.js?v=3"></script>

    <!-- 🟢 FIX: Crash-Free Inline Script -->
    <script>
        // ============================================================
        // VISION AI v2.0 - INDEX INITIALIZATION (CRASH FREE)
        // ============================================================

        // Variables NOT already declared in index.js (use var to avoid redeclaration errors)
        var currentSubject = 'general';
        var lastGeneratedImages = [];
        var editingMessageId = null;
        var refreshTimer = null;

        document.addEventListener('DOMContentLoaded', function () {
            // Search bar input listener (unique to this inline script)
            const historySearch = document.getElementById('history-search');
            if (historySearch) {
                historySearch.addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase();
                    document.querySelectorAll('.chat-item-wrapper').forEach(el => {
                        const title = el.querySelector('.chat-title')?.textContent.toLowerCase() || '';
                        el.style.display = title.includes(term) ? 'flex' : 'none';
                    });
                });
            }

            // Close chat action menus when clicking outside
            document.addEventListener('click', (event) => {
                if (!event.target.closest('.chat-item-wrapper')) {
                    document.querySelectorAll('.chat-action-menu.show').forEach(el => el.classList.remove('show'));
                }
            });

            console.log('👁️ Vision AI v2.0 - Ready');
        });
    </script>
</body>
</html>
