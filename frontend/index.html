  <script>
  /* Anti-FOUC: set theme BEFORE first paint (no network wait) */
  (function () {
    try {
      var t = localStorage.getItem('vision_ai_theme') || 'dark';
      var p = localStorage.getItem('vision_theme_preset') || 'humanly';
      if (t === 'system') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      if (t !== 'light' && t !== 'dark') t = 'dark';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-theme-preset', p);
      document.documentElement.style.colorScheme = t === 'light' ? 'light' : 'dark';
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.documentElement.setAttribute('data-theme-preset', 'humanly');
      document.documentElement.style.colorScheme = 'dark';
    }
  })();
  </script>

<script>
(function workerBadge(){
  async function tick(){
    try {
      const r = await fetch('/api/workers?t=' + Date.now());
      const d = await r.json();
      const on = !!(d.live && d.live.ok);
      const el = document.getElementById('gpuWorkerBadge');
      if (!el) return;
      el.innerHTML = on
        ? '<span class="topbar-chip-icon" style="color:#22c55e">●</span><span class="topbar-chip-label">GPU On</span>'
        : '<span class="topbar-chip-icon">⚡</span><span class="topbar-chip-label">Boost</span>';
      el.title = on ? 'GPU worker online — open Boost page' : 'Optional GPU Boost (Colab/Kaggle)';
    } catch (_) {}
  }
  tick();
  setInterval(tick, 20000);
})();
</script>
