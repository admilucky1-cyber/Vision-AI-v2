# Free keep-alive: pings your deployed Vision AI every 10 minutes
# so free hosts (Render/Railway sleep) wake up, and optionally pings workers.
#
# Setup:
# 1. Repo → Settings → Secrets → Actions
#    APP_URL=https://your-app.onrender.com
#    (optional) WORKER_URLS=https://xxx.ngrok-free.app,https://yyy...
# 2. Enable Actions on the repo
# 3. Workflow runs on schedule (UTC)

name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:          # manual run

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping main app
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret not set — skip"
            exit 0
          fi
          URL="${APP_URL%/}/api/keep-alive"
          echo "Pinging $URL"
          code=$(curl -s -o /tmp/ka.json -w "%{http_code}" --max-time 30 "$URL" || true)
          echo "HTTP $code"
          head -c 500 /tmp/ka.json || true
          echo

      - name: Ping extra worker URLs
        env:
          WORKER_URLS: ${{ secrets.WORKER_URLS }}
        run: |
          if [ -z "$WORKER_URLS" ]; then
            echo "No WORKER_URLS secret"
            exit 0
          fi
          IFS=',' read -ra URLS <<< "$WORKER_URLS"
          for u in "${URLS[@]}"; do
            u=$(echo "$u" | xargs)
            [ -z "$u" ] && continue
            echo "Pinging worker $u/worker/health"
            curl -s -o /dev/null -w "%{http_code}\n" --max-time 20 "$u/worker/health" || true
          done
