# Used only if Railway does NOT use Dockerfile.
# Prefer Settings → Build → Builder = Dockerfile (see railway.toml).

[phases.setup]
aptPkgs = [
  "ffmpeg",
  "curl",
  "tesseract-ocr",
  "poppler-utils",
]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "pip install -U yt-dlp",
]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port ${PORT:-5050} --workers 1 --proxy-headers --forwarded-allow-ips=*"
