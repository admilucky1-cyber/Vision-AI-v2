# Force Docker so ffmpeg + system tools exist (Nixpacks alone has no ffmpeg)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# If you set a Custom Start Command in the Railway UI, use ONE of:
#   (empty)  → uses Dockerfile CMD
#   python run.py
#   uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips=*
# Do NOT use: python run.py  if run.py is missing from the image root.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
